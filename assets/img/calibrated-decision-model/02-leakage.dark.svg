<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="t d"><title id="t">Stacking questions changes the answers; branches do not</title><desc id="d">Typed label probabilities for two questions. Isolated runs and IPPD branches agree to five decimals. Naive concatenation moves Q2 from &#x27;no&#x27; to &#x27;yes&#x27; and Q3 from &#x27;medium&#x27; to &#x27;high&#x27;.</desc><style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ctx:#9a988f; --block:#2a2a28; --wash1:rgba(57,135,229,0.16); --wash2:rgba(217,89,38,0.16); --wash3:rgba(25,158,112,0.18); --washc:rgba(154,152,143,0.16); }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .bg { fill: var(--surface); }
  .t2 { fill: var(--ink2); } .tm { fill: var(--muted); }
  .title { font-size: 15px; font-weight: 600; } .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; } .small { font-size: 11px; } .tick { font-size: 11px; fill: var(--muted);
         font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
  .f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .fc { fill: var(--ctx); }
  .fb { fill: var(--block); } .fw1 { fill: var(--wash1); } .fw2 { fill: var(--wash2); }
  .fw3 { fill: var(--wash3); } .fwc { fill: var(--washc); } .fs { fill: var(--surface); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); } .l3 { stroke: var(--s3); } .lc { stroke: var(--ctx); }
  .lm { stroke: var(--muted); } .lk { stroke: var(--ink2); } .ls { stroke: var(--surface); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .thin { fill: none; stroke-width: 1.25; }
  .box { fill: none; stroke: var(--axis); stroke-width: 1.25; }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style><rect width="780" height="300" class="bg"/>
<text x="20.0" y="26.0" class="title" text-anchor="start">Stacking questions changes the answers. Branches don&#x27;t.</text>
<text x="20.0" y="46.0" class="sub" text-anchor="start">Qwen2.5-0.5B, probability over each question&#x27;s label tokens. Isolated and branch values agree to 5 decimals, so they share one bar.</text>
<text x="20.0" y="82.0" class="lab" text-anchor="start" font-weight="600">Q2: Does the customer threaten to cancel?</text>
<text x="80.0" y="121.0" class="lab" text-anchor="end">yes</text>
<path d="M90.0,100.0 H146.2 Q150.2,100.0 150.2,104.0 V110.0 Q150.2,114.0 146.2,114.0 H90.0 Z" class="f1"/>
<text x="156.2" y="111.0" class="small t2" text-anchor="start">0.24</text>
<path d="M90.0,118.0 H220.2 Q224.2,118.0 224.2,122.0 V128.0 Q224.2,132.0 220.2,132.0 H90.0 Z" class="f2"/>
<text x="230.2" y="129.0" class="small t2" text-anchor="start">0.54</text>
<text x="80.0" y="173.0" class="lab" text-anchor="end">no</text>
