<text x="557.2" y="129.0" class="small t2" text-anchor="start">0.28</text>
<text x="470.0" y="173.0" class="lab" text-anchor="end">medium</text>
<path d="M480.0,152.0 H612.2 Q616.2,152.0 616.2,156.0 V162.0 Q616.2,166.0 612.2,166.0 H480.0 Z" class="f1"/>
<text x="622.2" y="163.0" class="small t2" text-anchor="start">0.54</text>
<path d="M480.0,170.0 H480.0 Q481.4,170.0 481.4,171.4 V182.6 Q481.4,184.0 480.0,184.0 H480.0 Z" class="f2"/>
<text x="487.4" y="181.0" class="small t2" text-anchor="start">0.01</text>
<text x="470.0" y="225.0" class="lab" text-anchor="end">high</text>
<path d="M480.0,204.0 H529.0 Q533.0,204.0 533.0,208.0 V214.0 Q533.0,218.0 529.0,218.0 H480.0 Z" class="f1"/>
<text x="539.0" y="215.0" class="small t2" text-anchor="start">0.21</text>
<path d="M480.0,222.0 H653.4 Q657.4,222.0 657.4,226.0 V232.0 Q657.4,236.0 653.4,236.0 H480.0 Z" class="f2"/>
<text x="663.4" y="233.0" class="small t2" text-anchor="start">0.71</text>
<line x1="480.0" y1="96.0" x2="480.0" y2="244.0" class="axis"/>
<rect x="20.0" y="273.0" width="12.0" height="12.0" rx="2" class="f1"/>
<text x="37.0" y="283.0" class="small t2" text-anchor="start">isolated run = branch (IPPD)</text>
<rect x="243.8" y="273.0" width="12.0" height="12.0" rx="2" class="f2"/>
<text x="260.8" y="283.0" class="small t2" text-anchor="start">naive stacked prompt</text>
