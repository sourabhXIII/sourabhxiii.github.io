<text x="211.8" y="181.0" class="small t2" text-anchor="start">0.46</text>
<line x1="90.0" y1="96.0" x2="90.0" y2="192.0" class="axis"/>
<text x="410.0" y="82.0" class="lab" text-anchor="start" font-weight="600">Q3: How urgent is this ticket?</text>
<text x="470.0" y="121.0" class="lab" text-anchor="end">low</text>
<path d="M480.0,100.0 H536.8 Q540.8,100.0 540.8,104.0 V110.0 Q540.8,114.0 536.8,114.0 H480.0 Z" class="f1"/>
<text x="546.8" y="111.0" class="small t2" text-anchor="start">0.24</text>
