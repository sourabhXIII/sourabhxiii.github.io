<text x="32.0" y="270.0" class="small" text-anchor="start" font-weight="600">synthetic states + typed questions</text>
<text x="32.0" y="288.0" class="small t2" text-anchor="start">&quot;we make all the data ourselves&quot;</text>
<rect x="32" y="296" width="80" height="16" rx="8" class="box"/>
<text x="72.0" y="308.0" class="small" text-anchor="middle">documented</text>
<rect x="270.0" y="246.0" width="230.0" height="70.0" rx="8" class="fwc"/>
<text x="282.0" y="270.0" class="small" text-anchor="start" font-weight="600">labels: frontier-model probabilities</text>
<text x="282.0" y="288.0" class="small t2" text-anchor="start">proper-score loss</text>
<rect x="282" y="296" width="80" height="16" rx="8" class="box"/>
<text x="322.0" y="308.0" class="small" text-anchor="middle">inferred</text>
<rect x="520.0" y="246.0" width="230.0" height="70.0" rx="8" class="fwc"/>
<text x="532.0" y="270.0" class="small" text-anchor="start" font-weight="600">RLCD on top</text>
<text x="532.0" y="288.0" class="small t2" text-anchor="start">on-policy or outcome RL?</text>
<rect x="532" y="296" width="80" height="16" rx="8" class="box"/>
<text x="572.0" y="308.0" class="small" text-anchor="middle">guess</text>
<text x="20.0" y="340.0" class="small tm" text-anchor="start">documented = TypeSafe&#x27;s docs or launch post say so.   inferred = follows from documented limits and behaviour.</text>
<text x="20.0" y="356.0" class="small tm" text-anchor="start">guess = consistent with the evidence, not implied by it.</text>
</svg>
