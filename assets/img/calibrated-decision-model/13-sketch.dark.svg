<text x="394.0" y="144.0" class="small t2" text-anchor="middle">shared prefix</text>
<rect x="354.0" y="156.0" width="80.0" height="18.0" rx="9" class="fs"/>
<rect x="354" y="156" width="80" height="18" rx="9" class="box"/>
<text x="394.0" y="169.0" class="small" text-anchor="middle">inferred</text>
