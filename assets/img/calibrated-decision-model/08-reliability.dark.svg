<circle cx="325.3" cy="207.7" r="4" class="f2 ring"/>
<circle cx="370.7" cy="130.0" r="4" class="f2 ring"/>
<path d="M146.8,333.2 L178.0,283.3 L211.3,251.7 L249.5,218.8 L286.4,181.2 L324.4,145.4 L363.3,100.1" class="line l3"/>
<circle cx="146.8" cy="333.2" r="4" class="f3 ring"/>
<circle cx="178.0" cy="283.3" r="4" class="f3 ring"/>
<circle cx="211.3" cy="251.7" r="4" class="f3 ring"/>
