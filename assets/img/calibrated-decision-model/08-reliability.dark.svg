<svg xmlns="http://www.w3.org/2000/svg" width="780" height="446" viewBox="0 0 780 446" role="img" aria-labelledby="t d"><title id="t">Reliability diagram for the toy task</title><desc id="d">Confidence vs accuracy in 10 bins. The supervised and RL students sit on the diagonal. The student distilled from an overconfident teacher sits below it: when it says 90% it is right about 75% of the time.</desc><style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ctx:#9a988f; --block:#2a2a28; --wash1:rgba(57,135,229,0.16); --wash2:rgba(217,89,38,0.16); --wash3:rgba(25,158,112,0.18); --washc:rgba(154,152,143,0.16); }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .bg { fill: var(--surface); }
  .t2 { fill: var(--ink2); } .tm { fill: var(--muted); }
  .title { font-size: 15px; font-weight: 600; } .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; } .small { font-size: 11px; } .tick { font-size: 11px; fill: var(--muted);
         font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
  .f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .fc { fill: var(--ctx); }
  .fb { fill: var(--block); } .fw1 { fill: var(--wash1); } .fw2 { fill: var(--wash2); }
  .fw3 { fill: var(--wash3); } .fwc { fill: var(--washc); } .fs { fill: var(--surface); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); } .l3 { stroke: var(--s3); } .lc { stroke: var(--ctx); }
  .lm { stroke: var(--muted); } .lk { stroke: var(--ink2); } .ls { stroke: var(--surface); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .thin { fill: none; stroke-width: 1.25; }
  .box { fill: none; stroke: var(--axis); stroke-width: 1.25; }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style><rect width="780" height="446" class="bg"/>
<text x="20.0" y="26.0" class="title" text-anchor="start">Copy an overconfident teacher, get an overconfident student</text>
<text x="20.0" y="46.0" class="sub" text-anchor="start">Toy task with known true probabilities. Each point: one confidence bin, 20,000 test inputs.</text>
<line x1="80.0" y1="380.0" x2="380.0" y2="380.0" class="grid"/>
<text x="72.0" y="384.0" class="tick" text-anchor="end">0.2</text>
<line x1="80.0" y1="305.0" x2="380.0" y2="305.0" class="grid"/>
<text x="72.0" y="309.0" class="tick" text-anchor="end">0.4</text>
<line x1="80.0" y1="230.0" x2="380.0" y2="230.0" class="grid"/>
<text x="72.0" y="234.0" class="tick" text-anchor="end">0.6</text>
<line x1="80.0" y1="155.0" x2="380.0" y2="155.0" class="grid"/>
<text x="72.0" y="159.0" class="tick" text-anchor="end">0.8</text>
<line x1="80.0" y1="80.0" x2="380.0" y2="80.0" class="grid"/>
<text x="72.0" y="84.0" class="tick" text-anchor="end">1.0</text>
<line x1="80.0" y1="380.0" x2="380.0" y2="380.0" class="axis"/>
<text x="36.0" y="230.0" class="small t2" text-anchor="middle" transform="rotate(-90 36.0 230.0)">accuracy in bin</text>
<text x="80.0" y="396.0" class="tick" text-anchor="middle">0.2</text>
<text x="155.0" y="396.0" class="tick" text-anchor="middle">0.4</text>
<text x="230.0" y="396.0" class="tick" text-anchor="middle">0.6</text>
<text x="305.0" y="396.0" class="tick" text-anchor="middle">0.8</text>
<text x="380.0" y="396.0" class="tick" text-anchor="middle">1.0</text>
<text x="230.0" y="414.0" class="small t2" text-anchor="middle">stated confidence</text>
<line x1="80.0" y1="380.0" x2="380.0" y2="80.0" class="thin lm"/>
<text x="368.8" y="77.8" class="small tm" text-anchor="end">perfect</text>
<path d="M146.3,370.3 L179.0,304.9 L211.3,272.0 L249.0,249.3 L287.1,237.8 L325.3,207.7 L370.7,130.0" class="line l2"/>
<circle cx="146.3" cy="370.3" r="4" class="f2 ring"/>
<circle cx="179.0" cy="304.9" r="4" class="f2 ring"/>
<circle cx="211.3" cy="272.0" r="4" class="f2 ring"/>
<circle cx="249.0" cy="249.3" r="4" class="f2 ring"/>
