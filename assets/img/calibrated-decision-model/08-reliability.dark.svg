<circle cx="324.4" cy="145.4" r="4" class="f3 ring"/>
<circle cx="363.3" cy="100.1" r="4" class="f3 ring"/>
<path d="M146.9,310.2 L177.8,284.7 L210.9,247.4 L248.6,215.1 L286.1,177.1 L324.1,141.6 L362.8,98.6" class="line l1"/>
<circle cx="146.9" cy="310.2" r="4" class="f1 ring"/>
<circle cx="177.8" cy="284.7" r="4" class="f1 ring"/>
<circle cx="210.9" cy="247.4" r="4" class="f1 ring"/>
<circle cx="248.6" cy="215.1" r="4" class="f1 ring"/>
<circle cx="286.1" cy="177.1" r="4" class="f1 ring"/>
<circle cx="324.1" cy="141.6" r="4" class="f1 ring"/>
<circle cx="362.8" cy="98.6" r="4" class="f1 ring"/>
<text x="331.3" y="241.5" class="small t2" text-anchor="start">says 85%,</text>
<text x="331.3" y="256.5" class="small t2" text-anchor="start">right 66%</text>
<text x="470.0" y="100.0" class="lab" text-anchor="start" font-weight="600">Final test numbers</text>
<text x="470.0" y="126.0" class="small tm" text-anchor="start"></text>
<text x="670.0" y="126.0" class="small tick" text-anchor="end">ECE</text>
<text x="755.0" y="126.0" class="small tick" text-anchor="end">KL to truth</text>
<text x="470.0" y="150.0" class="small" text-anchor="start">supervised (log loss)</text>
<text x="670.0" y="150.0" class="small" text-anchor="end">0.008</text>
<text x="755.0" y="150.0" class="small" text-anchor="end">0.010</text>
<text x="470.0" y="174.0" class="small" text-anchor="start">RL, proper-score reward</text>
<text x="670.0" y="174.0" class="small" text-anchor="end">0.016</text>
<text x="755.0" y="174.0" class="small" text-anchor="end">0.009</text>
<text x="470.0" y="198.0" class="small" text-anchor="start">distil, honest teacher</text>
<text x="670.0" y="198.0" class="small" text-anchor="end">0.009</text>
<text x="755.0" y="198.0" class="small" text-anchor="end">0.000</text>
<text x="470.0" y="222.0" class="small" text-anchor="start">distil, overconfident</text>
<text x="670.0" y="222.0" class="small" text-anchor="end">0.122</text>
<text x="755.0" y="222.0" class="small" text-anchor="end">0.122</text>
<text x="470.0" y="270.0" class="small t2" text-anchor="start">The honest-teacher student lands exactly</text>
<text x="470.0" y="286.0" class="small t2" text-anchor="start">on the oracle, so it is not drawn.</text>
<rect x="80.0" y="425.0" width="12.0" height="12.0" rx="2" class="f1"/>
<text x="97.0" y="435.0" class="small t2" text-anchor="start">supervised</text>
<rect x="185.0" y="425.0" width="12.0" height="12.0" rx="2" class="f3"/>
<text x="202.0" y="435.0" class="small t2" text-anchor="start">RL</text>
<rect x="237.2" y="425.0" width="12.0" height="12.0" rx="2" class="f2"/>
<text x="254.2" y="435.0" class="small t2" text-anchor="start">student of overconfident teacher</text>
</svg>
