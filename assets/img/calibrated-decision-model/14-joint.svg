<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" role="img" aria-labelledby="t d"><title id="t">Calibrated marginals, wrong joint</title><desc id="d">Two questions, A (threatens to cancel, 70%) and B (likely to churn, 60%). Multiplying isolated answers implies both are true 42% of the time. If they are correlated, the true joint can be 58%. Both mosaics have identical marginals.</desc><style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --ctx:#7d7b75; --block:#ecebe6; --wash1:rgba(42,120,214,0.10); --wash2:rgba(235,104,52,0.10); --wash3:rgba(27,175,122,0.12); --washc:rgba(125,123,117,0.12); }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .bg { fill: var(--surface); }
  .t2 { fill: var(--ink2); } .tm { fill: var(--muted); }
  .title { font-size: 15px; font-weight: 600; } .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; } .small { font-size: 11px; } .tick { font-size: 11px; fill: var(--muted);
         font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
  .f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .fc { fill: var(--ctx); }
  .fb { fill: var(--block); } .fw1 { fill: var(--wash1); } .fw2 { fill: var(--wash2); }
  .fw3 { fill: var(--wash3); } .fwc { fill: var(--washc); } .fs { fill: var(--surface); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); } .l3 { stroke: var(--s3); } .lc { stroke: var(--ctx); }
  .lm { stroke: var(--muted); } .lk { stroke: var(--ink2); } .ls { stroke: var(--surface); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .thin { fill: none; stroke-width: 1.25; }
  .box { fill: none; stroke: var(--axis); stroke-width: 1.25; }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style><rect width="780" height="340" class="bg"/>
<text x="20.0" y="26.0" class="title" text-anchor="start">Each answer calibrated, the combination wrong</text>
<text x="20.0" y="46.0" class="sub" text-anchor="start">A = &quot;threatens to cancel&quot; (70%), B = &quot;likely to churn&quot; (60%). Same marginals in both squares.</text>
<text x="40.0" y="80.0" class="lab" text-anchor="start" font-weight="600">Multiply the isolated answers</text>
<rect x="41.0" y="91.0" width="138.0" height="118.0" rx="2" class="f1"/>
<rect x="41.0" y="211.0" width="138.0" height="78.0" rx="2" class="fb"/>
<text x="110.0" y="155.0" class="lab" text-anchor="middle" font-weight="600">A and B: 0.42</text>
<rect x="181.0" y="91.0" width="58.0" height="118.0" rx="2" class="fw1"/>
<rect x="181.0" y="211.0" width="58.0" height="78.0" rx="2" class="fb"/>
<text x="110.0" y="308.0" class="small t2" text-anchor="middle">A (0.70)</text>
<text x="210.0" y="308.0" class="small t2" text-anchor="middle">not A</text>
<text x="300.0" y="80.0" class="lab" text-anchor="start" font-weight="600">What is actually true (correlated)</text>
<rect x="301.0" y="91.0" width="138.0" height="163.7" rx="2" class="f1"/>
<rect x="301.0" y="256.7" width="138.0" height="32.3" rx="2" class="fb"/>
<text x="370.0" y="177.9" class="lab" text-anchor="middle" font-weight="600">A and B: 0.58</text>
<rect x="441.0" y="91.0" width="58.0" height="11.3" rx="2" class="fw1"/>
<rect x="441.0" y="104.3" width="58.0" height="184.7" rx="2" class="fb"/>
<text x="370.0" y="308.0" class="small t2" text-anchor="middle">A (0.70)</text>
<text x="470.0" y="308.0" class="small t2" text-anchor="middle">not A</text>
<text x="540.0" y="110.0" class="lab" text-anchor="start" font-weight="600">Rule: escalate if A and B</text>
<text x="540.0" y="134.0" class="small" text-anchor="start">code computes  0.70 × 0.60 = 0.42</text>
<text x="540.0" y="154.0" class="small" text-anchor="start">true rate                     = 0.58</text>
<text x="540.0" y="186.0" class="small t2" text-anchor="start">Every marginal check passes.</text>
<text x="540.0" y="204.0" class="small t2" text-anchor="start">The joint is off by 16 points,</text>
<text x="540.0" y="222.0" class="small t2" text-anchor="start">and no single-question loss</text>
<text x="540.0" y="240.0" class="small t2" text-anchor="start">can see it.</text>
<text x="20.0" y="326.0" class="small tm" text-anchor="start">Shaded blue: B true. Filled blue: A and B both true. Column widths are P(A); heights within a column are P(B | column).</text>
</svg>
