<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" aria-labelledby="t d"><title id="t">Encoder rows vs decoder branches</title><desc id="d">Top: open encoder replicas put each question in its own row with a full copy of the state, so the state is encoded once per question. Bottom: a decoder with branch masks encodes the state once and hangs every question off it.</desc><style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ctx:#9a988f; --block:#2a2a28; --wash1:rgba(57,135,229,0.16); --wash2:rgba(217,89,38,0.16); --wash3:rgba(25,158,112,0.18); --washc:rgba(154,152,143,0.16); }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .bg { fill: var(--surface); }
  .t2 { fill: var(--ink2); } .tm { fill: var(--muted); }
  .title { font-size: 15px; font-weight: 600; } .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; } .small { font-size: 11px; } .tick { font-size: 11px; fill: var(--muted);
         font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
  .f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .fc { fill: var(--ctx); }
  .fb { fill: var(--block); } .fw1 { fill: var(--wash1); } .fw2 { fill: var(--wash2); }
  .fw3 { fill: var(--wash3); } .fwc { fill: var(--washc); } .fs { fill: var(--surface); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); } .l3 { stroke: var(--s3); } .lc { stroke: var(--ctx); }
  .lm { stroke: var(--muted); } .lk { stroke: var(--ink2); } .ls { stroke: var(--surface); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .thin { fill: none; stroke-width: 1.25; }
  .box { fill: none; stroke: var(--axis); stroke-width: 1.25; }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style><rect width="780" height="330" class="bg"/>
<text x="20.0" y="26.0" class="title" text-anchor="start">Where the state gets read</text>
<text x="20.0" y="62.0" class="lab" text-anchor="start" font-weight="600">Encoder, one row per question (OpenJev, Laya as published)</text>
<rect x="20.0" y="76.0" width="90.0" height="24.0" rx="3" class="f1"/>
<text x="65.0" y="92.0" class="small" text-anchor="middle">Q1 + options</text>
<rect x="112.0" y="76.0" width="300.0" height="24.0" rx="3" class="fc"/>
<text x="262.0" y="92.0" class="small" text-anchor="middle">state (full copy)</text>
<rect x="20.0" y="106.0" width="90.0" height="24.0" rx="3" class="f2"/>
<text x="65.0" y="122.0" class="small" text-anchor="middle">Q2 + options</text>
<rect x="112.0" y="106.0" width="300.0" height="24.0" rx="3" class="fc"/>
<text x="262.0" y="122.0" class="small" text-anchor="middle">state (full copy)</text>
<rect x="20.0" y="136.0" width="90.0" height="24.0" rx="3" class="f3"/>
<text x="65.0" y="152.0" class="small" text-anchor="middle">Q3 + options</text>
<rect x="112.0" y="136.0" width="300.0" height="24.0" rx="3" class="fc"/>
<text x="262.0" y="152.0" class="small" text-anchor="middle">state (full copy)</text>
<text x="430.0" y="112.0" class="small t2" text-anchor="start">state encoded 3 times</text>
<text x="430.0" y="130.0" class="small t2" text-anchor="start">questions isolated: yes</text>
<text x="430.0" y="148.0" class="small t2" text-anchor="start">options see each other: yes</text>
<text x="20.0" y="202.0" class="lab" text-anchor="start" font-weight="600">Decoder with branch masks (Block 1)</text>
<rect x="20.0" y="216.0" width="300.0" height="24.0" rx="3" class="fc"/>
<text x="170.0" y="232.0" class="small" text-anchor="middle">state (once)</text>
<rect x="322.0" y="216.0" width="92.0" height="24.0" rx="3" class="f1"/>
<text x="368.0" y="232.0" class="small" text-anchor="middle">Q1 + options</text>
<rect x="416.0" y="216.0" width="92.0" height="24.0" rx="3" class="f2"/>
<text x="462.0" y="232.0" class="small" text-anchor="middle">Q2 + options</text>
<rect x="510.0" y="216.0" width="92.0" height="24.0" rx="3" class="f3"/>
<text x="556.0" y="232.0" class="small" text-anchor="middle">Q3 + options</text>
<text x="620.0" y="222.0" class="small t2" text-anchor="start">state encoded once</text>
<text x="620.0" y="240.0" class="small t2" text-anchor="start">questions isolated: yes</text>
<text x="620.0" y="258.0" class="small t2" text-anchor="start">options read in order</text>
<text x="20.0" y="306.0" class="small t2" text-anchor="start">Both keep questions isolated. Only the branch layout shares the state, which is where the 20× prefill saving comes from.</text>
</svg>
